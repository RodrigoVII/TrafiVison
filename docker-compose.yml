services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trafivision-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend/Interfaz web TrafiVision
      dockerfile: Dockerfile
    container_name: trafivision-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
